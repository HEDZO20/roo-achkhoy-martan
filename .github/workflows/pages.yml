name: Deploy ROO V27 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          required=(index.html app.css app.js config.js analysis-engine.js docx-export.js)
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing $file" >&2; exit 1; }
            cp "$file" _site/
          done
          test -d assets && cp -R assets _site/assets || true
          cp index.html _site/404.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
