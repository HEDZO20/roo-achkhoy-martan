name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html manifest.webmanifest _site/
          cp styles.css v3.css v4.css v5.css v6.css v7.css _site/
          cp app.js v3.js v4.js v5.js v6.js v7.js config.js online.js _site/
          cp assets/*.svg _site/assets/
          cp "ШАБЛОН_РЕЗУЛЬТАТОВ_ЭКЗАМЕНОВ.csv" _site/
          cp index.html _site/404.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
