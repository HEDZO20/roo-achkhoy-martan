<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>РОО Ачхой-Мартановского района</title><link rel="stylesheet" href="app.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script><script defer src="config.js"></script><script defer src="analysis-engine.js"></script><script defer src="docx-export.js"></script><script defer src="app.js"></script></head><body>
<div id="toast" class="toast"></div>
<section id="auth" class="auth-shell"><div class="brand-card"><div class="brand-mark brand-mark-auth" id="authBrandMark"><img id="authBrandImage" alt="Логотип" hidden><span class="brand-fallback">РОО</span></div><h1 id="authBrandTitle">Отдел образования Ачхой-Мартановского района</h1><p>Поручения, школы, экзамены и отчётность в одной понятной системе.</p></div><div class="auth-card"><div class="tabs"><button class="tab active" data-auth="login">Вход</button><button class="tab" data-auth="register">Регистрация</button></div><form id="loginForm"><label>Рабочая почта<input id="loginEmail" type="email" required></label><label>Пароль<input id="loginPassword" type="password" required></label><button class="primary" type="submit">Войти</button></form><form id="registerForm" hidden><label>Ф.И.О.<input id="regName" required></label><label>Рабочая почта<input id="regEmail" type="email" required></label><label>Телефон<input id="regPhone"></label><label>Место работы<select id="regPlace"><option value="roo">РОО</option><option value="school">Школа</option></select></label><label>Организация<select id="regUnit"><option value="">Выберите после загрузки списка</option></select></label><label>Пароль<input id="regPassword" type="password" minlength="8" required></label><button class="primary" type="submit">Отправить заявку</button><p class="hint">Роль назначит начальник РОО. Самостоятельно выбирать права нельзя.</p></form></div></section>
<div id="app" class="app" hidden><aside class="sidebar"><div class="logo"><div class="brand-mark brand-mark-side" id="sideBrandMark"><img id="sideBrandImage" alt="Логотип" hidden><span class="brand-fallback">РОО</span></div><div class="brand-title"><b id="brandShortName">Ачхой-Мартан</b><small id="brandSubtitle">Отдел образования</small></div></div><nav id="nav"></nav><button id="logout" class="ghost bottom">Выйти</button></aside><main><header><button id="menuBtn" class="icon-btn">☰</button><div><small id="crumb">Главная</small><h2 id="pageTitle">Главная</h2></div><div class="user"><div><b id="userName"></b><small id="userRole"></small></div><span id="avatar"></span></div></header><section id="content"></section></main></div>
<dialog id="modal"><form method="dialog" class="modal-box"><button class="close">×</button><div id="modalBody"></div></form></dialog>
</body></html>
